<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden City Computers — Store & CRM</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#12243a;--line:#203752;--text:#edf6ff;--muted:#91a6bd;--blue:#18a8ff;--cyan:#5bd5ff;--green:#39d98a;--red:#ff6376;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#142033}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:#06101d;color:white;padding:14px 5%;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:18px;letter-spacing:.5px}.logo b{color:#1caaff}.search{flex:1;max-width:560px;background:#12243a;border:1px solid #27415e;color:white;border-radius:9px;padding:11px 14px}.nav{display:flex;gap:18px;font-size:13px}.nav a{color:#c8d6e5;text-decoration:none;cursor:pointer}.pill{background:#0e83cc;padding:8px 12px;border-radius:7px}
.hero{background:linear-gradient(120deg,#06111f,#0b2340 55%,#07111f);color:white;padding:62px 6%;display:flex;align-items:center;justify-content:space-between;gap:30px}.hero h1{font-size:48px;max-width:680px;margin:8px 0}.hero h1 span{color:#19aaff}.hero p{color:#b8cbe0;font-size:18px}.btn{border:0;border-radius:8px;padding:12px 18px;background:#159ff0;color:white;font-weight:800}.btn.alt{background:transparent;border:1px solid #49627c}.wrap{max-width:1250px;margin:auto;padding:34px 20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 16px}.section-title h2{margin:0}.muted{color:#71849a}.cats,.products,.stats,.grid{display:grid;gap:16px}.cats{grid-template-columns:repeat(6,1fr)}.cat,.card,.stat,.panel{background:white;border:1px solid #e3eaf2;border-radius:12px;padding:16px}.cat{text-align:center;cursor:pointer}.cat:hover,.card:hover{box-shadow:0 8px 25px #15263a18;transform:translateY(-2px)}.cat .icon{font-size:32px;margin-bottom:8px}.products{grid-template-columns:repeat(4,1fr)}.card img{width:100%;height:170px;object-fit:contain;background:#f6f8fb;border-radius:9px}.price{font-size:19px;font-weight:900;margin:9px 0}.old{text-decoration:line-through;color:#9aa7b6;font-size:13px;margin-left:6px}.tag{display:inline-block;padding:4px 7px;border-radius:5px;background:#e8f7ff;color:#0879b9;font-size:11px;font-weight:800}.card .btn{width:100%;margin-top:8px}.feature{background:#081729;color:white;border-radius:15px;padding:28px;display:flex;justify-content:space-between;align-items:center;margin-top:28px}.feature h2{margin-top:0;color:#54cfff}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.footer{background:#06101d;color:#c9d8e8;padding:38px 6%;margin-top:40px}.hidden{display:none!important}
.crm{min-height:100vh;background:#f3f6fa}.crmbar{background:#071321;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.crmnav{background:#091a2d;color:#b9cbe0;width:230px;position:fixed;top:0;bottom:0;padding:20px 12px}.crmnav h3{color:white}.crmnav button{display:block;width:100%;text-align:left;background:transparent;color:#b9cbe0;border:0;padding:12px;border-radius:7px;margin:3px 0}.crmnav button.active,.crmnav button:hover{background:#0d83d0;color:white}.crmmain{margin-left:230px;padding:25px}.stats{grid-template-columns:repeat(4,1fr)}.stat strong{display:block;font-size:26px;margin-top:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #e5ebf2;text-align:left;font-size:13px}.badge{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:800}.ok{background:#e7fbf1;color:#168151}.warn{background:#fff5df;color:#a06b00}.bad{background:#ffe8ec;color:#bb3045}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{padding:10px;border:1px solid #d8e1eb;border-radius:7px;background:white}.form{display:grid;gap:10px}.modal{position:fixed;inset:0;background:#06101d88;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modalbox{background:white;border-radius:12px;padding:22px;max-width:520px;width:100%}.close{float:right;border:0;background:none;font-size:24px}.chart{height:190px;display:flex;align-items:end;gap:10px;padding:20px}.bar{flex:1;background:#18a8ff;border-radius:5px 5px 0 0}.actions{display:flex;gap:6px}.empty{text-align:center;padding:40px;color:#8292a5}
@media(max-width:900px){.nav{display:none}.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:36px}.cats{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.crmnav{position:relative;width:100%;height:auto}.crmmain{margin-left:0}.two{grid-template-columns:1fr}}
@media(max-width:560px){.cats,.products,.stats{grid-template-columns:1fr}.hero{padding:40px 20px}.wrap{padding:20px 14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const seedProducts=[
{id:1,name:"AMD Ryzen 5 5600",cat:"PC Components",price:11999,img:"https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=600&q=80"},
{id:2,name:"GeForce RTX 4060 8GB",cat:"PC Components",price:32999,img:"https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=600&q=80"},
{id:3,name:"Corsair Vengeance 16GB DDR4",cat:"Memory",price:4299,img:"https://images.unsplash.com/photo-1562976540-1502c2145186?auto=format&fit=crop&w=600&q=80"},
{id:4,name:"Samsung 980 1TB NVMe SSD",cat:"Storage",price:6299,img:"https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?auto=format&fit=crop&w=600&q=80"},
{id:5,name:"ASUS Gaming Laptop",cat:"Laptops",price:74999,img:"https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=600&q=80"},
{id:6,name:"27-inch 180Hz Gaming Monitor",cat:"Monitors",price:18999,img:"https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=600&q=80"},
{id:7,name:"TP-Link Wi-Fi 6 Router",cat:"Networking",price:5499,img:"https://images.unsplash.com/photo-1606904825846-647eb07f5be2?auto=format&fit=crop&w=600&q=80"},
{id:8,name:"Mechanical RGB Keyboard",cat:"Accessories",price:2999,img:"https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80"}
];
const load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let products=load("g_products",seedProducts), cart=load("g_cart",[]), leads=load("g_leads",[
{name:"Rahul Sharma",source:"Website",status:"New"},{name:"Priya Patel",source:"Walk-in",status:"Contacted"},{name:"Aman Khan",source:"Instagram",status:"Qualified"}]);
let customers=load("g_customers",[]), orders=load("g_orders",[]), tickets=load("g_tickets",[]);
let page="store", crmTab="Dashboard", query="";

function money(n){return "₹"+Number(n).toLocaleString("en-IN")}
function store(){
document.getElementById("app").innerHTML=`<div class="top"><div class="logo"><b>GC</b> GARDEN CITY<br><small>COMPUTERS</small></div><input class="search" placeholder="Search for products, brands and more..." value="${query}" oninput="query=this.value;renderStore()"><div class="nav"><a onclick="scrollTo(0,0)">Home</a><a onclick="filterCat('PC Components')">PC Components</a><a onclick="filterCat('Laptops')">Laptops</a><a onclick="filterCat('Accessories')">Accessories</a><a onclick="filterCat('Networking')">Networking</a><a onclick="showCRM()">CRM</a></div><button class="pill" onclick="showCart()">Cart (${cart.length})</button></div>
<section class="hero"><div><div class="tag">GENUINE PRODUCTS • EXPERT SUPPORT</div><h1>Build Your <span>Dream PC</span> with Garden City Computers</h1><p>Latest components · competitive prices · expert support · repair & upgrades.</p><button class="btn" onclick="filterCat('PC Components')">Shop Now →</button> <button class="btn alt" onclick="quote()">Build Your PC</button></div><div style="font-size:100px">🖥️</div></section>
<div class="wrap"><div class="section-title"><h2>Shop by Category</h2><span class="muted">Bengaluru · Sadar Patrappa Road</span></div>
<div class="cats">${[["🧩","PC Components"],["🎮","Gaming PCs"],["💻","Laptops"],["🖥️","Monitors"],["⌨️","Accessories"],["📡","Networking"]].map(x=>`<div class="cat" onclick="filterCat('${x[1]}')"><div class="icon">${x[0]}</div><b>${x[1]}</b><div class="muted">Explore →</div></div>`).join("")}</div>
<div class="section-title"><h2>Featured Products</h2><span class="muted">${products.length} products</span></div><div class="products">${products.filter(p=>!query||p.name.toLowerCase().includes(query.toLowerCase())||p.cat.toLowerCase().includes(query.toLowerCase())).map(p=>`<div class="card"><img src="${p.img}" alt=""><span class="tag">${p.cat}</span><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="muted">★★★★☆ · Genuine product</div><button class="btn" onclick="addCart(${p.id})">Add to Cart</button></div>`).join("")}</div>
<div class="feature"><div><h2>Custom PC Builder</h2><p>Gaming PCs · Workstations · Budget builds · High-end builds</p><button class="btn" onclick="quote()">Start Building →</button></div><div style="font-size:80px">🖥️</div></div>
<div class="two" style="margin-top:18px"><div class="card"><h2>🔧 PC Repair & Upgrade</h2><p class="muted">Fast diagnostics, upgrades, OS setup, hardware replacement and service tickets.</p><button class="btn" onclick="serviceTicket()">Book Service</button></div><div class="card"><h2>🔥 Special Offers</h2><p class="muted">Ask our team for current bundle and custom-build offers.</p><button class="btn" onclick="quote()">Get a Quote</button></div></div></div>
<footer class="footer"><b>GC GARDEN CITY COMPUTERS</b><p>One Stop Computer Solution</p><p>1st Floor, Chamundeshwari Complex, Thigalarapet Road Cross, Sadar Patrappa Road, Bengaluru 560002</p><p>☎ +91 80 4176 5255</p><button class="btn" onclick="showCRM()">Open CRM Dashboard</button></footer>`;
}
function renderStore(){store()}
function filterCat(c){query=c;renderStore()}
function addCart(id){cart.push(products.find(p=>p.id==id));save("g_cart",cart);alert("Added to cart")}
function showCart(){let total=cart.reduce((a,p)=>a+p.price,0);openModal(`<h2>Your Cart</h2>${cart.length?cart.map((p,i)=>`<p>${p.name} — <b>${money(p.price)}</b> <button onclick="removeCart(${i})">×</button></p>`).join("")+`<hr><h3>Total ${money(total)}</h3><button class="btn" onclick="checkout()">Checkout</button>`:`<div class="empty">Your cart is empty.</div>`}`)}
function removeCart(i){cart.splice(i,1);save("g_cart",cart);showCart()}
function checkout(){if(!cart.length)return;let total=cart.reduce((a,p)=>a+p.price,0);orders.push({id:"ORD-"+Date.now().toString().slice(-6),customer:"Website Customer",amount:total,status:"Pending Payment",date:new Date().toLocaleDateString()});save("g_orders",orders);cart=[];save("g_cart",cart);closeModal();alert("Order created. Configure a live gateway in CRM → Payment Gateway before accepting real payments.")}
function quote(){openModal(`<h2>Build Your PC / Request Quote</h2><div class="form"><input id="qname" placeholder="Your name"><input id="qphone" placeholder="Phone"><input id="qbudget" placeholder="Budget (₹)"><textarea id="qneed" placeholder="Tell us what you need"></textarea><button class="btn" onclick="submitQuote()">Send Quote Request</button></div>`)}
function submitQuote(){leads.push({name:document.getElementById("qname").value||"New Quote Lead",source:"Website",status:"New"});save("g_leads",leads);closeModal();alert("Quote request submitted to CRM.")}
function serviceTicket(){openModal(`<h2>Book Repair / Service</h2><div class="form"><input id="sname" placeholder="Customer name"><input id="sphone" placeholder="Phone"><input id="sdevice" placeholder="Device / PC"><textarea id="sissue" placeholder="Problem description"></textarea><button class="btn" onclick="submitTicket()">Create Service Ticket</button></div>`)}
function submitTicket(){tickets.push({id:"TKT-"+Date.now().toString().slice(-5),customer:document.getElementById("sname").value||"Walk-in",device:document.getElementById("sdevice").value||"PC",issue:document.getElementById("sissue").value||"Diagnostics",status:"Open"});save("g_tickets",tickets);closeModal();alert("Service ticket created.")}
function showCRM(){page="crm";renderCRM()}
function crmNav(){return `<aside class="crmnav"><h3><span style="color:#1aaaff">GC</span> GARDEN CITY</h3>${["Dashboard","Customers","Leads","Orders","Products","Inventory","Quotations","Service Tickets","Tasks","Analytics","Payment Gateway","Settings"].map(t=>`<button class="${crmTab==t?"active":""}" onclick="crmTab='${t}';renderCRM()">${t}</button>`).join("")}<button onclick="page='store';renderStore()" style="margin-top:20px">← Storefront</button></aside>`}
function renderCRM(){document.getElementById("app").innerHTML=`<div class="crm">${crmNav()}<main class="crmmain"><div class="crmbar"><b>CRM Dashboard</b><span>Admin · Administrator</span></div><div style="padding-top:22px">${crmContent()}</div></main></div>`}
function crmContent(){
if(crmTab==="Dashboard")return `<h1>CRM Dashboard</h1><p class="muted">Welcome back. Here's what's happening with your business.</p><div class="stats">${[["Total Sales",money(orders.reduce((a,o)=>a+Number(o.amount||0),0))],["Total Orders",orders.length],["New Leads",leads.length],["Open Tickets",tickets.filter(t=>t.status!="Closed").length]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div><div class="two" style="margin-top:18px"><div class="panel"><h3>Sales Overview</h3><div class="chart">${[30,45,38,58,50,72,86].map(h=>`<div class="bar" style="height:${h}%"></div>`).join("")}</div></div><div class="panel"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="crmTab='Products';renderCRM()">Add Product</button><button class="btn" onclick="crmTab='Leads';renderCRM()">Add Lead</button><button class="btn" onclick="quote()">Create Quote</button><button class="btn" onclick="serviceTicket()">Service Ticket</button></div><p class="muted">Use the modules on the left to manage customers, sales, inventory, service and payments.</p></div></div>`;
if(crmTab==="Leads")return `<h1>Leads</h1><div class="toolbar"><button class="btn" onclick="addLead()">+ Add Lead</button></div><div class="panel"><table class="table"><tr><th>Name</th><th>Source</th><th>Status</th></tr>${leads.map((l,i)=>`<tr><td>${l.name}</td><td>${l.source}</td><td><span class="badge ${l.status==="New"?"warn":"ok"}">${l.status}</span></td></tr>`).join("")}</table></div>`;
if(crmTab==="Orders")return `<h1>Orders</h1><div class="panel"><table class="table"><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr>${orders.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${money(o.amount)}</td><td><span class="badge ${o.status==="Delivered"?"ok":"warn"}">${o.status}</span></td><td>${o.date}</td></tr>`).join("")||`<tr><td colspan=5 class="empty">No orders yet.</td></tr>`}</table></div>`;
if(crmTab==="Products"||crmTab==="Inventory")return `<h1>${crmTab}</h1><div class="toolbar"><button class="btn" onclick="addProduct()">+ Add Product</button><input placeholder="Search products"></div><div class="panel"><table class="table"><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th></tr>${products.map(p=>`<tr><td>${p.name}</td><td>${p.cat}</td><td>${money(p.price)}</td><td><span class="badge ok">In Stock</span></td></tr>`).join("")}</table></div>`;
if(crmTab==="Customers")return `<h1>Customers</h1><div class="toolbar"><button class="btn" onclick="addCustomer()">+ Add Customer</button></div><div class="panel"><table class="table"><tr><th>Name</th><th>Phone</th><th>Email</th></tr>${customers.map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.email}</td></tr>`).join("")||`<tr><td colspan=3 class="empty">No customers yet. Add one to start CRM.</td></tr>`}</table></div>`;
if(crmTab==="Service Tickets")return `<h1>Service Tickets</h1><div class="toolbar"><button class="btn" onclick="serviceTicket()">+ New Ticket</button></div><div class="panel"><table class="table"><tr><th>Ticket</th><th>Customer</th><th>Device</th><th>Issue</th><th>Status</th></tr>${tickets.map(t=>`<tr><td>${t.id}</td><td>${t.customer}</td><td>${t.device}</td><td>${t.issue}</td><td><span class="badge warn">${t.status}</span></td></tr>`).join("")||`<tr><td colspan=5 class="empty">No service tickets.</td></tr>`}</table></div>`;
if(crmTab==="Payment Gateway")return `<h1>Payment Gateway</h1><p class="muted">Choose a gateway for online payments. Live transactions require your merchant credentials/API keys.</p><div class="panel form"><select id="gateway"><option>Razorpay</option><option>Stripe</option><option>Cashfree</option><option>PayU</option></select><input id="key" placeholder="Key ID / Public Key"><input id="secret" placeholder="Secret Key (stored securely in production)"><label><input type="checkbox" id="live"> Enable live payments</label><button class="btn" onclick="saveGateway()">Save Gateway Settings</button><p id="gwstatus" class="muted"></p></div>`;
if(crmTab==="Analytics")return `<h1>Analytics</h1><div class="stats">${[["Revenue",money(orders.reduce((a,o)=>a+Number(o.amount||0),0))],["Average Order",orders.length?money(orders.reduce((a,o)=>a+Number(o.amount||0),0)/orders.length):"₹0"],["Leads",leads.length],["Tickets",tickets.length]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div><div class="panel" style="margin-top:18px"><h3>Performance</h3><p class="muted">Connect your real sales/payment data for live analytics.</p></div>`;
return `<h1>${crmTab}</h1><div class="panel"><p class="muted">This module is ready as a functional CRM workspace. Add your business records and workflows here.</p></div>`;
}
function addLead(){openModal(`<h2>Add Lead</h2><div class="form"><input id="ln" placeholder="Name"><input id="ls" placeholder="Source"><button class="btn" onclick="leads.push({name:document.getElementById('ln').value||'New Lead',source:document.getElementById('ls').value||'Manual',status:'New'});save('g_leads',leads);closeModal();renderCRM()">Save Lead</button></div>`)}
function addCustomer(){openModal(`<h2>Add Customer</h2><div class="form"><input id="cn" placeholder="Name"><input id="cp" placeholder="Phone"><input id="ce" placeholder="Email"><button class="btn" onclick="customers.push({name:document.getElementById('cn').value||'Customer',phone:document.getElementById('cp').value||'',email:document.getElementById('ce').value||''});save('g_customers',customers);closeModal();renderCRM()">Save Customer</button></div>`)}
function addProduct(){openModal(`<h2>Add Product</h2><div class="form"><input id="pn" placeholder="Product name"><input id="pc" placeholder="Category"><input id="pp" type="number" placeholder="Price"><button class="btn" onclick="products.push({id:Date.now(),name:document.getElementById('pn').value||'New Product',cat:document.getElementById('pc').value||'General',price:Number(document.getElementById('pp').value)||0,img:'https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=600&q=80'});save('g_products',products);closeModal();renderCRM()">Save Product</button></div>`)}
function saveGateway(){localStorage.setItem("g_gateway",JSON.stringify({gateway:document.getElementById("gateway").value,key:document.getElementById("key").value,live:document.getElementById("live").checked}));document.getElementById("gwstatus").textContent="Gateway settings saved locally. Connect server-side credentials before production."}
function openModal(body){let m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button>${body}</div>`;document.body.appendChild(m)}
function closeModal(){document.getElementById("modal")?.remove()}
function render(){page==="crm"?renderCRM():store()} render();
</script>
</body></html>
